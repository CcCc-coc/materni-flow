# See claude code environment variables documents at https://code.claude.com/docs/en/settings
[env]

[tools]
claude = "latest"
python = "3.12"
ruff = "latest"
uv = "latest"
node = "24"
pnpm = "latest"

# === Tasks
[tasks.venv-create]
description = "✨ Create Python virtual environment (.venv)"
run = "uv venv"

[tasks.venv-remove]
description = "💥 Remove Python virtual environment folder (.venv)"
run = "rm -r .venv"

[tasks.inst-python-deps]
description = "💾 Install Python dependencies via uv"
run = "uv sync --all-extras"

[tasks.inst-node-deps]
description = "📦 Install Node.js dependencies via pnpm"
run = "pnpm install"

[tasks.inst]
description = "💾 Install all dependencies (Python + Node.js)"
depends = ["inst-python-deps", "inst-node-deps"]

[tasks.setup-db]
description = "📥 Seed tmp/data.sqlite from the committed data/data.sqlite.example"
run = ".venv/bin/python scripts/test_01_setup_sqlite_file.py"

[tasks.sync-db]
description = "☁️  Publish tmp/data.sqlite into this project's PostgreSQL schema"
run = ".venv/bin/python scripts/test_06_sync_data_to_remote_db.py"

[tasks.verify-db]
description = "🔎 Confirm the remote schema matches local, table by table"
run = ".venv/bin/python scripts/test_07_verify_remote_data.py"

[tasks.export]
description = "💾 Export Python dependencies to requirements.txt (not used by Vercel)"
# Vercel does NOT read this. It reads pyproject.toml + uv.lock directly, and
# when both exist it prefers the lock file. The task is kept for deploying
# somewhere that only understands requirements.txt; the generated file is not
# committed, because a second dependency list is a second thing to drift.
run = "uv export --format requirements-txt --no-dev --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements.txt"

[tasks.check]
description = "🔍 Check the repo agrees with its config and its seed (run after a dataset swap)"
run = ".venv/bin/python scripts/test_00_check_project_config.py"

[tasks.test-python]
description = "🧪 Run Python tests with pytest"
run = ".venv/bin/pytest tests_python"

[tasks.test-node]
description = "🧪 Run Node.js tests"
run = "node --test tests_node/*.test.js"

[tasks.test]
description = "🧪 Run all checks and tests (config consistency + Python + Node.js)"
depends = ["check", "test-python", "test-node"]

[tasks.cov-python]
description = "🧪 Run Python code coverage tests with pytest"
run = ".venv/bin/pytest tests_python -s --tb=native --cov=agent_app --cov-report term-missing --cov-report html:htmlcov"

[tasks.cov]
description = "🧪 Run all code coverage tests (Python + Node.js)"
depends = ["cov-python"]

# Every dev server is stamped with this env var so `mise run kill` can find
# exactly our processes and nothing else. Children inherit it, so tagging the
# top of each tree tags next-server, the postcss worker, and the uvicorn
# reloader for free.
#
# The name is generic on purpose and may be shared with other projects grown
# from this scaffold: what identifies a checkout is the *value*, which is this
# checkout's path, so a second clone never kills the first one's servers.
# kill-dev-servers.py reads the same name -- change it in both places or in
# neither.
[tasks.next-dev]
description = "🌐 Start Next.js development server"
env = { AGENT_APP_DEV_SERVER = "{{config_root}}" }
# Pinned to 3000 on purpose. Left to itself Next.js hops to 3001 when 3000 is
# taken, but next.config.js rewrites /api to a hardcoded 127.0.0.1:8000, so the
# hopped-to frontend silently talks to whichever backend owns 8000 -- possibly
# another checkout's. Failing to start is the better outcome.
run = "next dev --port 3000"

[tasks.fastapi-dev]
description = "⚙️ Start FastAPI development server"
env = { AGENT_APP_DEV_SERVER = "{{config_root}}" }
run = "uv run -- python -m uvicorn api.index:app --reload --host 127.0.0.1 --port 8000"

[tasks.dev]
description = "🚀 Start all development servers (Next.js + FastAPI)"
depends = ["kill"]
env = { AGENT_APP_DEV_SERVER = "{{config_root}}" }
run = "pnpm exec concurrently 'mise run next-dev' 'mise run fastapi-dev'"

[tasks.kill]
description = "🛑 Kill this project's development servers (Next.js + FastAPI)"
run = "uv run -- python kill-dev-servers.py"
