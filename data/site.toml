[brand]
displayName = "MaterniFlow"
logoPrefix = "Materni"
logoAccent = "Flow"
footerName = "MaterniFlow"

[seo]
locale = "en_US"
title = "MaterniFlow | Obstetrics Ward Analytics"
description = "Explore a simulated obstetrics ward. Check bed availability, review shift handovers, follow blood pressure trends, and see upcoming procedures."
keywords = ["obstetrics", "ward operations", "shift handover", "bed availability", "postpartum stay", "procedure scheduling"]

[[capabilities]]
icon = "Users"
title = "Shift Handover"
subtitle = "See who is on the ward and where they are in their stay."
tooltip = "A shift handover gives the next team a shared picture of the ward. Counts change as patients arrive, give birth, and go home. Patients waiting to go home still count until they leave."

[[capabilities]]
icon = "BarChart3"
title = "Bed Capacity"
subtitle = "Find beds that are ready now and beds still being cleaned."
tooltip = "Bed capacity shows how many beds the ward can put to use. A bed can be occupied, ready for a patient, being cleaned, or out for repair. Each state matters when you need a bed now."

[[capabilities]]
icon = "AlertTriangle"
title = "Risk Monitoring"
subtitle = "Review pending alerts and changes in recorded readings."
tooltip = "An alert points to a reading or recorded condition that may need attention. Looking at several readings in time order can reveal a steady rise. The alert list also shows which flags staff have seen."

[[capabilities]]
icon = "Clock"
title = "Care Scheduling"
subtitle = "Review planned procedures, staffing, and expected discharge."
tooltip = "A procedure schedule shows what is planned, when it starts, and who is assigned. Staff rosters show who is listed to work that shift. Expected discharge times help the team see when a bed might open."

[home]
tagline = "Obstetrics Ward Analytics"
description = "Ask about a simulated maternity ward in plain English. See who is on the ward, which beds are ready, what needs a closer look, and which procedures are scheduled next."
blurb = "Explore 11 tables and 355 synthetic records covering admissions, beds, staffing, and care events."
techStack = ["Strands SDK", "PostgreSQL", "Next.js"]

[home.headline]
prefix = "Materni"
accent = "Flow"

[home.cta]
title = "Explore the Ward"
subtitle = "Ask a question about the ward snapshot."

[home.businessContext]
triggerLabel = "What problem does this solve?"
title = "The business behind the agent"
subtitle = "A closer look at the questions maternity ward teams answer between shifts."

[chat]
agent = "MaterniFlow"
welcomeSubtitle = "Ask about beds, handovers, alerts, or the schedule in the simulated ward."
tryExamples = "Try asking which beds are ready or what procedures are scheduled in the next 48 hours."
suggestionsHint = "Ask a question or choose an example."
inputPlaceholder = "Ask about the ward..."

[chat.messages]
welcomeMessage = "I’m here to help you explore the simulated obstetrics ward."
waitForResponse = "Wait for the current answer to finish first."

[[chat.suggestedActions]]
render = "free"
title = "Introduction"
label = "What can you do?"
action = "What can you do? Give me a short tour of the simulated obstetrics ward and the kinds of questions you can answer."

# Q1
[[chat.suggestedActions]]
render = "flowchart"
title = "Ward Handover"
label = "Where is everyone in their stay?"
action = "Show the obstetrics admission stages as a flowchart. Label each stage with its count at the snapshot. State how many admissions are active, with discharged patients counted separately."

# Q2
[[chat.suggestedActions]]
render = "table"
title = "Bed Availability"
label = "Which beds are ready now?"
action = "Show bed availability by room type as a Markdown table, and show the SQL you ran. Include room type, available now, occupied, cleaning, maintenance, and total beds."

# Q7
[[chat.suggestedActions]]
render = "chart"
title = "Blood Pressure Trend"
label = "How did blood pressure change?"
action = "Pick the active high-risk admission with the most blood pressure readings. Show systolic and diastolic pressure by reading time as a line chart, and briefly describe the observed change."

# Q5
[[chat.suggestedActions]]
render = "free"
title = "Labor Progress"
label = "Who has the most advanced labor exam?"
action = "Among patients who are admitted or in labor, which three have the greatest dilation on their latest recorded exam? Include room, dilation, membrane status, and exam time."

# Q6
[[chat.suggestedActions]]
render = "flowchart"
title = "Alert Review"
label = "Which alerts still need review?"
action = "Show the alert review process as a flowchart. Split the current alerts into acknowledged and pending branches with counts. Break the pending branch down by severity."

# Q3
[[chat.suggestedActions]]
render = "table"
title = "High Risk Rounds"
label = "Who is on the high risk list?"
action = "List currently admitted patients with a high risk rating as a Markdown table, and show the SQL you ran. Include patient, gestational weeks, number of fetuses, admission stage, room, and bed."

# Q10
[[chat.suggestedActions]]
render = "chart"
title = "Bed Utilization"
label = "Which room types are fullest?"
action = "Show the percentage of beds occupied in each room type as a bar chart. Use all beds of that type as the denominator and identify the room type with the highest occupancy."

# Q18
[[chat.suggestedActions]]
render = "free"
title = "Multiple Pregnancies"
label = "How many neonatal beds are open?"
action = "How many neonatal intensive care beds are available now? Summarize how many patients with multiple pregnancies are currently admitted and where they are on the ward."

# Q19
[[chat.suggestedActions]]
render = "flowchart"
title = "Order Status"
label = "Where do open orders stand?"
action = "Show the recorded order states as a flowchart, with all orders branching into scheduled, in progress, completed, and cancelled. Label each branch with its current count."

# Q4
[[chat.suggestedActions]]
render = "table"
title = "Procedure Schedule"
label = "What is scheduled in the next 48 hours?"
action = "List cesareans and inductions scheduled in the next 48 hours from the ward snapshot as a Markdown table, and show the SQL you ran. Include time, procedure, patient, room, and assigned provider."

# Q9
[[chat.suggestedActions]]
render = "chart"
title = "Postpartum Stay"
label = "How long are patients expected to stay?"
action = "Show the average predicted hours after delivery by actual delivery method as a bar chart. State how many deliveries contribute to each average."
